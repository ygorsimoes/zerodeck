name: "📚 Documentation"
description: "Report unclear docs, broken links, missing setup instructions, or typos."
title: "[Docs]: "
labels:
  - documentation

body:
  - type: markdown
    attributes:
      value: |
        ## 📚 Documentation Improvement
        Clear docs keep contributors moving fast. Let us know what can be clarified or expanded!

  - type: input
    id: location
    attributes:
      label: "📄 File or Section"
      description: "Which file, guide, or command documentation needs attention?"
      placeholder: "e.g. docs/architecture/wire-protocol.md or Dockerfile"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: "✍️ What Should Be Improved?"
      description: "Explain what is confusing, outdated, or missing, and suggest a fix if you have one."
    validations:
      required: true
