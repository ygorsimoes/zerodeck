name: CI

# Every job runs the same `just` recipe a developer runs locally, inside the same pinned toolchain
# image (Dockerfile `dev` stage, built by .github/actions/dev-image). Branch protection requires the
# `rust`, `deny`, `python`, `frontend` and `docker` checks, so keep those job ids stable.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  # Host directories (cached by actions/cache) that compose mounts instead of its named volumes.
  ZERODECK_CARGO_HOME: ./.ci-cache/cargo-home
  ZERODECK_CARGO_TARGET: ./.ci-cache/target
  ZERODECK_FUZZ_TARGET: ./.ci-cache/fuzz-target

jobs:
  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: just@1.59.0
      - name: actionlint, hadolint, compose config
        run: just lint-infra

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-image
        with:
          cargo-cache: rust
      - name: rustfmt, clippy, tests
        run: just check-rust

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-image
      - name: cargo deny check
        run: just deny

  python-tests:
    name: python-tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the declared floor (`requires-python`); the rest cover SteamOS and newer hosts.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: just@1.59.0
      - name: unittest in python:${{ matrix.python-version }}-slim
        run: just py-test-on "${{ matrix.python-version }}"

  # Kept as `python` because branch protection requires that check name; it only passes when every
  # interpreter above passed and lint/type checks succeed.
  python:
    name: python
    needs: python-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-image
      - name: ruff, pyright (strict), unittest
        run: just check-python

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-image
      - name: biome, tsc, build, tests
        run: just check-frontend

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: just@1.59.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          load: true
          push: false
          tags: zerodeck:runtime
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime,ignore-error=true
      - name: Smoke test (hardened compose service must become healthy)
        run: just smoke --no-build
      - name: Package release tarball (dry run)
        run: just dist ci-${{ github.run_number }}

  # Root-only tests (`privileged_*`: privilege drop, parent-death signal) in the compose
  # `privileged-test` container (not a required check).
  privileged:
    name: privileged
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-image
      - name: Root-only tests
        run: just test-privileged

  # Rust line coverage (not a required check). Download the `coverage` artifact to browse the
  # HTML report or feed lcov.info to an editor; nothing is sent to a third-party service.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-image
        with:
          cargo-cache: coverage
      - name: cargo llvm-cov (HTML + lcov)
        run: just coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: ${{ env.ZERODECK_CARGO_TARGET }}/coverage
          if-no-files-found: error

  # Smoke-fuzzes every target for 30s (not a required check). Run longer locally with
  # `just fuzz <target> <seconds>`.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-image
        with:
          target: fuzz
          cargo-cache: fuzz
      - name: Fuzz each target for 30 seconds
        run: just fuzz-all 30
