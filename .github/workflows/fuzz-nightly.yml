name: Fuzz (nightly)

# Runs every cargo-fuzz target for 5 minutes each, once a night, growing a corpus that is cached
# between runs. Crashes fail the job and upload their reproducers. The 30 s smoke fuzz in ci.yml
# keeps running on every PR.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  # Host directories (cached by actions/cache) that compose mounts instead of its named volumes.
  ZERODECK_CARGO_HOME: ./.ci-cache/cargo-home
  ZERODECK_CARGO_TARGET: ./.ci-cache/target
  ZERODECK_FUZZ_TARGET: ./.ci-cache/fuzz-target

jobs:
  fuzz-nightly:
    name: fuzz-nightly
    # Scheduled runs only make sense on the upstream repository (forks have no corpus cache).
    if: github.repository == 'ygorsimoes/zerodeck'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-image
        with:
          target: fuzz
          cargo-cache: fuzz
      - name: Restore fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz each target for 5 minutes
        run: just fuzz-all 300
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/**
          if-no-files-found: ignore
