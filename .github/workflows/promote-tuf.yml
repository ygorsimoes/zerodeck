name: Promote TUF authorization

# Manual, protected Stable gate. There is deliberately no `release: published` trigger: publishing
# an immutable GitHub release never authorizes the Stable channel. A maintainer dispatches this
# workflow from the default branch, the `production` environment requires reviewer approval, and
# Stable additionally requires a committed `Stable eligible: PASS` hardware evidence record.
# Scripts are always read from the default branch, never from tag-controlled code.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published immutable release tag to promote (e.g. v0.1.0)
        required: true
        type: string
      channel:
        description: Signed loader channel (Stable requires a PASS hardware record)
        required: true
        default: testing
        type: choice
        options:
          - testing
          - stable

permissions: {}

concurrency:
  group: tuf-promotion-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify-and-request:
    name: Verify published bytes and request TUF signing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Configure this environment in repository settings with required reviewers and a protected
    # default branch. Without the protected environment a manual dispatch is not an approval gate.
    environment: production
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Checkout the default-branch promotion scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Record the reviewed promotion source
        id: source
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"

      - name: Verify the exact immutable published release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || {
            echo "not a release SemVer tag: ${tag}" >&2
            exit 1
          }
          version="${tag#v}"
          if [[ "${CHANNEL}" == "stable" && "${version}" == *-* ]]; then
            echo "a prerelease cannot be promoted to Stable" >&2
            exit 1
          fi
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          python3 - "${release_json}" "${tag}" >"${RUNNER_TEMP}/release.meta" <<'PY'
          import json
          import sys

          document = json.loads(sys.argv[1])
          tag = sys.argv[2]
          if document.get("tag_name") != tag:
              raise SystemExit(f"release tag {document.get('tag_name')!r} != {tag!r}")
          if document.get("draft") is not False:
              raise SystemExit("refusing to promote a draft release")
          if document.get("immutable") is not True:
              raise SystemExit("refusing to promote a mutable release; immutable releases are not enforced")
          expected = {
              f"zerodeck-{tag}-linux-x86_64.tar.gz",
              f"zerodeck-{tag}-linux-x86_64.managed.tar.gz",
              "SHA256SUMS.txt",
          }
          actual = {asset.get("name") for asset in document.get("assets", [])}
          if actual != expected:
              raise SystemExit(f"release assets {sorted(actual)} != {sorted(expected)}")
          print(f"version={tag[1:]}")
          print(f"release_id={document['id']}")
          print(f"target_commitish={document.get('target_commitish', '')}")
          PY
          # shellcheck disable=SC1090
          source "${RUNNER_TEMP}/release.meta"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq '.sha')"
          [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "cannot resolve the release tag to an exact commit" >&2
            exit 1
          }
          if [[ "${target_commitish}" =~ ^[0-9a-f]{40}$ && "${target_commitish}" != "${sha}" ]]; then
            echo "release target ${target_commitish} != tag commit ${sha}" >&2
            exit 1
          fi
          git merge-base --is-ancestor "${sha}" HEAD || {
            echo "release commit ${sha} is not on the reviewed default branch" >&2
            exit 1
          }
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "sha=${sha}"
            echo "channel=${CHANNEL}"
          } >>"${GITHUB_OUTPUT}"

      - name: Download the published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "zerodeck-${TAG}-linux-x86_64.tar.gz" --dir dist
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "zerodeck-${TAG}-linux-x86_64.managed.tar.gz" --dir dist
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "SHA256SUMS.txt" --dir dist
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Validate the exact published archives
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          ZERODECK_EXPECTED_VERSION="${tag#v}" \
            bash deploy/update/tests/release.sh --validate-only \
              "dist/zerodeck-${tag}-linux-x86_64.tar.gz"
          ZERODECK_EXPECTED_VERSION="${tag#v}" \
            bash deploy/update/tests/release.sh --validate-only \
              "dist/zerodeck-${tag}-linux-x86_64.managed.tar.gz"

      - name: Require Stable hardware evidence
        if: inputs.channel == 'stable'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          archive="dist/zerodeck-${TAG}-linux-x86_64.managed.tar.gz"
          digest="$(sha256sum "${archive}" | awk '{print $1}')"
          build_id="$(python3 - "${archive}" <<'PY'
          import json, sys, tarfile
          with tarfile.open(sys.argv[1], "r:gz") as handle:
              print(json.load(handle.extractfile("release.json"))["build_id"])
          PY
          )"
          bash deploy/update/verify-stable-evidence.sh \
            --tag "${TAG}" --version "${VERSION}" --build-id "${build_id}" \
            --sha256 "${digest}" \
            --evidence "deploy/update/evidence/${TAG}.md"

      - name: Verify provenance and render the promotion request
        id: request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          MIN_UPDATER: ${{ vars.TUF_MIN_UPDATER || '0.1.0' }}
        run: |
          set -euo pipefail
          archive="dist/zerodeck-${TAG}-linux-x86_64.managed.tar.gz"
          digest="$(sha256sum "${archive}" | awk '{print $1}')"
          build_id="$(python3 - "${archive}" <<'PY'
          import json, sys, tarfile
          with tarfile.open(sys.argv[1], "r:gz") as handle:
              print(json.load(handle.extractfile("release.json"))["build_id"])
          PY
          )"
          bash deploy/update/promote.sh \
            --archive "${archive}" --sha256 "${digest}" \
            --tag "${TAG}" --version "${VERSION}" --channel "${CHANNEL}" \
            --min-updater "${MIN_UPDATER}" --build-id "${build_id}" \
            --repository "${GITHUB_REPOSITORY}" \
            --source-sha "${RELEASE_SHA}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-please.yml" \
            --source-ref "refs/heads/main" | tee target-descriptor.txt
          {
            echo "digest=${digest}"
            echo "build_id=${build_id}"
          } >>"${GITHUB_OUTPUT}"

      - name: Write the external signing request
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          MIN_UPDATER: ${{ vars.TUF_MIN_UPDATER || '0.1.0' }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          TUF_REPOSITORY: ${{ vars.TUF_ON_CI_REPOSITORY }}
          DIGEST: ${{ steps.request.outputs.digest }}
          BUILD_ID: ${{ steps.request.outputs.build_id }}
          PROMOTION_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          [[ -n "${TUF_REPOSITORY}" ]] || {
            echo "TUF_ON_CI_REPOSITORY is not configured; refusing to pretend a promotion happened" >&2
            exit 1
          }
          archive="dist/zerodeck-${TAG}-linux-x86_64.managed.tar.gz"
          size="$(wc -c <"${archive}" | tr -d ' ')"
          python3 - "${TAG}" "${VERSION}" "${BUILD_ID}" "${CHANNEL}" "${MIN_UPDATER}" \
            "${DIGEST}" "${size}" "${TUF_REPOSITORY}" "${RELEASE_SHA}" \
            "${PROMOTION_SOURCE_SHA}" >promotion-request.json <<'PY'
          import json, os, sys
          (tag, version, build_id, channel, min_updater, digest, size, tuf_repository,
           release_sha, promotion_source_sha) = sys.argv[1:11]
          document = {
              "schema": 1,
              "tag": tag,
              "version": version,
              "build_id": build_id,
              "channel": channel,
              "min_updater": min_updater,
              "target": f"linux-x86_64/zerodeck-{version}.tar.gz",
              "sha256": digest,
              "length": int(size),
              "source_repository": os.environ["GITHUB_REPOSITORY"],
              "source_sha": release_sha,
              "source_ref": "refs/heads/main",
              "signer_workflow": f"{os.environ['GITHUB_REPOSITORY']}/.github/workflows/release-please.yml",
              "source_release": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{tag}",
              "source_release_immutable": True,
              "stable_evidence": (
                  f"deploy/update/evidence/{tag}.md" if channel == "stable" else None
              ),
              "promotion_source_sha": promotion_source_sha,
              "promotion_source_ref": "refs/heads/main",
              "tuf_repository": tuf_repository,
          }
          print(json.dumps(document, indent=2))
          PY
          cat promotion-request.json

      - name: Upload the promotion request evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tuf-promotion-request
          path: |
            promotion-request.json
            target-descriptor.txt
          if-no-files-found: error
          retention-days: 90

      - name: Dispatch the request to the external TUF-on-CI repository
        env:
          GH_TOKEN: ${{ secrets.TUF_PROMOTION_TOKEN }}
          TUF_REPOSITORY: ${{ vars.TUF_ON_CI_REPOSITORY }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" || -z "${TUF_REPOSITORY}" ]]; then
            echo "TUF promotion authority is not configured" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          # repository_dispatch accepts at most 10 top-level client_payload properties, so the whole
          # request travels under a single `request` key.
          payload = {
              "event_type": "zerodeck-loader-release",
              "client_payload": {"request": json.load(open("promotion-request.json"))},
          }
          json.dump(payload, open("dispatch.json", "w"))
          PY
          gh api --method POST "repos/${TUF_REPOSITORY}/dispatches" --input dispatch.json
          echo "promotion requested; the external TUF repository must sign and publish before the channel resolves to this version"
