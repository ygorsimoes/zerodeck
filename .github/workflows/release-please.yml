name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish Container & Release Tarball
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest,enable=${{ !contains(needs.release-please.outputs.version, '-') }}

      - name: Build and push runtime container image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          build-args: |
            VERSION=${{ needs.release-please.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Package Linux release tarball and checksums
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo "${REPO}" | tr '[:upper:]' '[:lower:]'):${VERSION}"
          STAGE_DIR="dist/zerodeck-${TAG}-linux-x86_64"
          ARCHIVE="zerodeck-${TAG}-linux-x86_64.tar.gz"
          mkdir -p "${STAGE_DIR}/bin" "${STAGE_DIR}/python" "${STAGE_DIR}/frontend" "${STAGE_DIR}/systemd"

          docker pull "${IMAGE}"
          CID="$(docker create "${IMAGE}")"
          trap 'docker rm -f "${CID}" >/dev/null 2>&1 || true' EXIT

          docker cp "${CID}:/usr/local/bin/zerodeckd" "${STAGE_DIR}/bin/zerodeckd"
          docker cp "${CID}:/opt/zerodeck/python/." "${STAGE_DIR}/python/"
          docker cp "${CID}:/opt/zerodeck/frontend/." "${STAGE_DIR}/frontend/"
          cp deploy/systemd/zerodeck.service "${STAGE_DIR}/systemd/zerodeck.service"
          cp LICENSE "${STAGE_DIR}/LICENSE"

          tar -C dist -czf "dist/${ARCHIVE}" "zerodeck-${TAG}-linux-x86_64"
          (cd dist && sha256sum "${ARCHIVE}" > SHA256SUMS.txt)

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "${TAG}" \
            "dist/zerodeck-${TAG}-linux-x86_64.tar.gz" \
            "dist/SHA256SUMS.txt" \
            --clobber
