[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0" # x-release-please-version
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/ygorsimoes/zerodeck"
authors = ["ZeroDeck Contributors"]

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
# Smaller, faster daemon binary. panic stays "unwind": a panicking task must not abort the daemon.
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace.dependencies]
# x-release-please-start-version
zerodeck-protocol = { version = "0.1.0", path = "crates/zerodeck-protocol" }
zerodeck-platform = { version = "0.1.0", path = "crates/zerodeck-platform" }
zerodeck-core = { version = "0.1.0", path = "crates/zerodeck-core" }
zerodeck-plugin-host = { version = "0.1.0", path = "crates/zerodeck-plugin-host" }
zerodeck-cef = { version = "0.1.0", path = "crates/zerodeck-cef" }
zerodeck-server = { version = "0.1.0", path = "crates/zerodeck-server" }
# x-release-please-end

tokio = { version = "1.54.1", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
tokio-tungstenite = "0.29.0"
tokio-util = { version = "0.7.20", features = ["io"] }
futures-util = { version = "0.3.34", default-features = false, features = ["async-await", "sink", "std"] }
url = "2.5.9"
percent-encoding = "2.3.2"
httpdate = "1.0.3"
inotify = "0.11.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.105"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
sha2 = "0.11.1"
hex = "0.4.3"
semver = { version = "1.0.28", features = ["serde"] }
tar = "0.4.46"
flate2 = "1.1.11"
tough = { version = "0.24.0", features = ["http"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
uuid = { version = "1.29.3", features = ["v4"] }
rustix = { version = "1.1.6", features = ["process", "fs", "net", "thread"] }
