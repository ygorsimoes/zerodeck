[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/ygorsimoes/zerodeck"
authors = ["ZeroDeck Contributors"]

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
zerodeck-protocol = { path = "crates/zerodeck-protocol" }
zerodeck-platform = { path = "crates/zerodeck-platform" }
zerodeck-core = { path = "crates/zerodeck-core" }
zerodeck-plugin-host = { path = "crates/zerodeck-plugin-host" }
zerodeck-cef = { path = "crates/zerodeck-cef" }
zerodeck-server = { path = "crates/zerodeck-server" }

tokio = { version = "1.54.1", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
tokio-tungstenite = "0.30.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.105"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
sha2 = "0.11.1"
hex = "0.4.3"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
uuid = { version = "1.29.3", features = ["v4"] }
rustix = { version = "1.1.6", features = ["process", "fs", "net"] }
