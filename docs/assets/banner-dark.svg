<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="ZeroDeck — Performance-first, security-hardened Steam Deck plugin loader daemon">
  <defs>
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="55%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#F97316" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid-dark" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.55" />
    </pattern>
  </defs>

  <rect width="880" height="220" rx="18" fill="url(#bg-dark)" />
  <rect width="880" height="220" rx="18" fill="url(#grid-dark)" />
  <rect x="0.75" y="0.75" width="878.5" height="218.5" rx="17.25" fill="none" stroke="#1E293B" stroke-width="1.5" />

  <circle cx="155" cy="110" r="115" fill="#38BDF8" opacity="0.07" />
  <circle cx="740" cy="70" r="130" fill="#F97316" opacity="0.06" />

  <!-- Handheld / ZeroDeck Mark -->
  <g transform="translate(64, 52)">
    <rect x="0" y="14" width="136" height="88" rx="22" fill="#0B1220" stroke="url(#accent-grad)" stroke-width="2.5" />
    <circle cx="23" cy="46" r="8" fill="none" stroke="#475569" stroke-width="2" />
    <circle cx="23" cy="72" r="5" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <circle cx="113" cy="46" r="8" fill="none" stroke="#475569" stroke-width="2" />
    <circle cx="113" cy="72" r="5" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <rect x="37" y="25" width="62" height="66" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <path d="M 55 41 L 81 41 L 61 61 L 82 61 L 57 77 L 65 61 L 54 61 Z" fill="url(#accent-grad)" />
  </g>

  <!-- Typography -->
  <g transform="translate(232, 84)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="-1.2" fill="#F8FAFC">
      Zero<tspan fill="url(#accent-grad)">Deck</tspan>
    </text>
    <text x="2" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#94A3B8">
      Performance-first, security-hardened Steam Deck plugin loader daemon
    </text>

    <!-- Tech pills -->
    <g transform="translate(2, 54)">
      <rect x="0" y="0" width="108" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="54" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#FDBA74">Rust 1.100+</text>

      <rect x="118" y="0" width="134" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="185" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#7DD3FC">Decky Compatible</text>

      <rect x="262" y="0" width="106" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="315" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#A5B4FC">MIT License</text>
    </g>
  </g>

  <rect x="48" y="218.5" width="784" height="1.5" fill="url(#glow-line)" />
</svg>
