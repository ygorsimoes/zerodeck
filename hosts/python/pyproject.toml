[project]
name = "zerodeck-py-host"
version = "0.1.0"
description = "Isolated Python plugin worker host for ZeroDeck"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
zerodeck-py-host = "zerodeck_py_host.runner:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "C4", "PIE"]

[tool.ruff.lint.per-file-ignores]
# Async test cases set up fixtures with ordinary blocking file and process calls.
"tests/*" = ["ASYNC"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
